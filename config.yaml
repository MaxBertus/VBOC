# Solver Parameters
prob_num: 10          # number of OCP to create dataset
cpu_num: 26

N: 50                    # horizon in seconds
N_increment: 0           # increment of the horizon
dt: 10e-3                  # time step
#alpha: 15                 # safety margin 

solver_mode: 'BALANCE'    # HPIPM mode, can be --> 'BALANCE', 'ROBUST', 'SPEED', 'SPEED_ABS'
nlp_max_iter: 100
qp_max_iter: 200
alpha_reduction: 0.3
alpha_min: 1e-2
levenberg_marquardt: 1e-6

state_tol: 1e-3           # state tolerance
# conv_tol: 1e-3            # convergence tolerance for the task
cost_tol: 1e-3            # Tolerance for the cost
vboc_repeat: 3         # VBOC repetition

# Training Parameters
learning_rate: 1e-3       # learning rate
batch_size: 4096          # batch size, 4096, 8192, 16384
beta: 0.95                # low pass filter coefficient
train_ratio: 0.7          # training dataset % size
val_ratio: 0.2            # validation dataset % size
hidden_size: 256          # number of hidden units in the neural network
hidden_layers: 2          # number of hidden layers in the neural network

# Robot & Environment Parameters
mass: 3.5     # platform mass [kg]
J:            # platform inertia [kg*m^2]
- [0.155, 0.0, 0.0]
- [0.0, 0.147, 0.0]
- [0.0, 0.0, 0.251]
l: 0.385      # length of the arm [m]
cf: 1.5e-3    # thrust coefficient [N/(Hz)^2]
ct: 4.590e-5  # torque coefficient [Nm/(Hz)^2]
max_w: 108    # max spinning rate [Hz]
alpha_tilt: 20     # Tilt cant angle [degree]

min_width: 0.525  # width/2 of the platform [m]
min_length: 0.475 # length/2 of the platform [m]
min_height: 0.2   # height/2 of the platform [m]

max_width: 0.5 # max width/2 of the environment [m]
max_length: 0.5 # max length/2 of the environment [m]
max_height: 0.5 # min width/2 of the environment [m]

# Data generation
orient_g_rej: true # select orientation with gravity rejection
